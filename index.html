<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Online Pro - Admin Ready</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#ff7a18;
    --secondary:#ffb347;
    --whatsapp:#25d366;
    --admin:#4a90e2;
    --glass:rgba(255,255,255,0.15);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
               url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    background-attachment: fixed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:520px;
    backdrop-filter:blur(20px);
    background:var(--glass);
    border-radius:25px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    color:white;
}

.header-logo{text-align:center;margin-bottom:15px; position: relative;}
.header-logo img{width:120px; border-radius: 50%;}

h2{
    margin:10px 0;
    font-weight:700;
    background:linear-gradient(45deg,var(--primary),var(--secondary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.section{
    margin-bottom:15px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
}

label{font-size:14px;font-weight:600;margin-bottom:5px;display:block;}

input,select,textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
    font-size:15px;
    outline:none;
}

.btn-order{
    width:100%;
    background:var(--whatsapp);
    border:none;
    padding:15px;
    font-size:16px;
    font-weight:700;
    color:white;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

/* --- ESTILOS ADMIN --- */
.admin-panel {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 450px;
    background: #222;
    padding: 20px;
    border-radius: 20px;
    z-index: 100;
    max-height: 80vh;
    overflow-y: auto;
    border: 2px solid var(--admin);
}

.admin-day-row {
    margin-bottom: 15px;
    border-bottom: 1px solid #444;
    padding-bottom: 10px;
}

.admin-day-row input {
    background: #333;
    color: white;
    border: 1px solid #555;
    margin-bottom: 5px;
}

.btn-admin-toggle {
    position: absolute;
    top: 0;
    right: 0;
    background: none;
    border: none;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
    font-size: 10px;
}

.btn-save-admin {
    background: var(--admin);
    color: white;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 90;
}
</style>
</head>

<body onload="inicializarApp()">

<div class="container">
    <div class="header-logo">
        <button class="btn-admin-toggle" onclick="verificarAdmin()">⚙️ Admin</button>
        <img src="https://i.imgur.com/3FvWdgi.gif" alt="Logo">
        <h2>Restaurante Gourmet</h2>
        <span id="fechaHoy" class="badge"></span>
    </div>

    <form id="orderForm">
        <div class="section">
            <label>📅 Día del Menú:</label>
            <select id="diaSemana" onchange="actualizarMenu()"></select>

            <label>🍲 Plato Principal:</label>
            <select id="platoSeleccionado"></select>
        </div>

        <div class="section">
            <label>➕ Adicionales:</label>
            <label><input type="checkbox" value="2000" onchange="calcularTotal()"> Fruta (+$2.000)</label>
            <label><input type="checkbox" value="1500" onchange="calcularTotal()"> Huevo Frito (+$1.500)</label>

            <label>🥤 Bebida:</label>
            <select id="bebida" onchange="calcularTotal()">
                <option value="0">Jugo del día (Incluido)</option>
                <option value="2500">Limonada (+$2.500)</option>
                <option value="3000">Gaseosa (+$3.000)</option>
            </select>

            <div class="total-box" style="text-align: center; font-size: 20px; margin-top: 10px;">
                💰 Total: $<span id="total">0</span>
            </div>
        </div>

        <div class="section">
            <label>👤 Datos de Envío:</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>
            <input type="text" id="direccion" placeholder="Tu dirección" required>
            <textarea id="notas" rows="2" placeholder="Notas (sin cebolla, etc.)"></textarea>
        </div>

        <button type="button" class="btn-order" onclick="enviarWhatsApp()">🚀 Enviar Pedido</button>
    </form>
</div>

<div id="overlay" class="overlay" onclick="cerrarAdmin()"></div>
<div id="adminPanel" class="admin-panel">
    <h3 style="margin-bottom:15px; color: var(--admin)">Configurar Menú Semanal</h3>
    <div id="adminInputs"></div>
    <button class="btn-save-admin" onclick="guardarMenuAdmin()">💾 Guardar Menú</button>
    <button onclick="cerrarAdmin()" style="background:none; color:white; border:none; margin-top:10px; width:100%; cursor:pointer;">Cancelar</button>
</div>

<script>
const PRECIO_BASE = 15500;
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

// Menú por defecto (si no hay nada guardado)
let menus = {
    "Lunes": ["Frijoles con Garra", "Pollo al Horno"],
    "Martes": ["Carne en Salsa", "Pescado Apanado"],
    "Miércoles": ["Ajiaco Santafereño", "Cerdo Grillé"],
    "Jueves": ["Sancocho de Pollo", "Arroz Mixto"],
    "Viernes": ["Bandeja Paisa", "Sobrebarriga"],
    "Sábado": ["Especial Parrilla", "Sancocho de Gallina"]
};

function inicializarApp() {
    // 1. Cargar menú desde LocalStorage si existe
    const menuGuardado = localStorage.getItem("menuPersonalizado");
    if (menuGuardado) {
        menus = JSON.parse(menuGuardado);
    }

    // 2. Llenar el selector de días
    const selectDia = document.getElementById('diaSemana');
    DIAS.forEach(d => {
        let opt = document.createElement('option');
        opt.text = d;
        selectDia.add(opt);
    });

    // 3. Establecer fecha y día actual
    const hoy = new Date();
    const diaReal = DIAS[hoy.getDay() - 1] || "Lunes"; // -1 porque 0 es Domingo
    selectDia.value = diaReal;

    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('fechaHoy').innerText = "Hoy es " + hoy.toLocaleDateString('es-ES', opciones);

    // 4. Cargar datos de usuario previos (tu info de entrega)
    document.getElementById("nombre").value = localStorage.getItem("nombre") || "";
    document.getElementById("direccion").value = localStorage.getItem("direccion") || "";

    actualizarMenu();
    calcularTotal();
}

function actualizarMenu() {
    const dia = document.getElementById('diaSemana').value;
    const selectPlato = document.getElementById('platoSeleccionado');
    selectPlato.innerHTML = "";

    menus[dia].forEach(p => {
        let opt = document.createElement('option');
        opt.text = p;
        selectPlato.add(opt);
    });
}

function calcularTotal() {
    let total = PRECIO_BASE;
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(e => total += parseInt(e.value));
    total += parseInt(document.getElementById('bebida').value);
    document.getElementById('total').innerText = total.toLocaleString();
}

/* --- FUNCIONES ADMINISTRADOR --- */
function verificarAdmin() {
    const pass = prompt("Ingrese clave de administrador:");
    if (pass === "1234") { // Cambia esta clave si lo deseas
        abrirAdmin();
    } else {
        alert("Clave incorrecta");
    }
}

function abrirAdmin() {
    const container = document.getElementById('adminInputs');
    container.innerHTML = "";

    DIAS.forEach(dia => {
        const div = document.createElement('div');
        div.className = "admin-day-row";
        div.innerHTML = `
            <label style="color:var(--secondary)">${dia}:</label>
            <input type="text" id="admin-${dia}-1" value="${menus[dia][0]}" placeholder="Plato 1">
            <input type="text" id="admin-${dia}-2" value="${menus[dia][1]}" placeholder="Plato 2">
        `;
        container.appendChild(div);
    });

    document.getElementById('adminPanel').style.display = "block";
    document.getElementById('overlay').style.display = "block";
}

function guardarMenuAdmin() {
    DIAS.forEach(dia => {
        const p1 = document.getElementById(`admin-${dia}-1`).value;
        const p2 = document.getElementById(`admin-${dia}-2`).value;
        menus[dia] = [p1, p2];
    });

    localStorage.setItem("menuPersonalizado", JSON.stringify(menus));
    alert("¡Menú actualizado correctamente!");
    cerrarAdmin();
    actualizarMenu();
}

function cerrarAdmin() {
    document.getElementById('adminPanel').style.display = "none";
    document.getElementById('overlay').style.display = "none";
}

function enviarWhatsApp() {
    const nombre = document.getElementById('nombre').value;
    const direccion = document.getElementById('direccion').value;

    if (!nombre || !direccion) {
        alert("Por favor completa tus datos de envío");
        return;
    }

    // Guardar datos de usuario para la próxima vez
    localStorage.setItem("nombre", nombre);
    localStorage.setItem("direccion", direccion);

    const dia = document.getElementById('diaSemana').value;
    const plato = document.getElementById('platoSeleccionado').value;
    const total = document.getElementById('total').innerText;
    
    let mensaje = `*NUEVO PEDIDO*\n\n📅 *Día:* ${dia}\n👤 *Cliente:* ${nombre}\n🍲 *Plato:* ${plato}\n🏠 *Dirección:* ${direccion}\n💰 *Total:* $${total}`;
    
    window.open(`https://wa.me/573143996019?text=${encodeURIComponent(mensaje)}`, '_blank');
}
</script>
</body>
</html>
