<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Gourmet - Pedidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root{
            --primary:#ff7a18;
            --secondary:#ffb347;
            --whatsapp:#25d366;
            --admin:#4a90e2;
            --glass:rgba(255,255,255,0.15);
        }

        *{box-sizing:border-box; margin:0; padding:0;}

        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
                       url('https://i.imgur.com/UOPlh0M.jpeg');
            background-size:cover;
            background-position:center;
            background-attachment: fixed;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:500px;
            backdrop-filter:blur(20px);
            background:var(--glass);
            border-radius:25px;
            padding:25px;
            box-shadow:0 15px 40px rgba(0,0,0,0.4);
            color:white;
        }

        .header-logo{text-align:center; margin-bottom:15px; position: relative;}
        .header-logo img{width:120px; border-radius:15px; margin-bottom:10px;}
        
        h2{ font-weight:700; background:linear-gradient(45deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        
        .badge{ display:inline-block; background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:20px; font-size:12px; margin-top:5px;}

        .section{ margin-bottom:15px; padding:15px; border-radius:15px; background:rgba(255,255,255,0.1); }
        
        label{ font-size:13px; font-weight:600; margin-bottom:5px; display:block; color: var(--secondary); }

        input, select, textarea {
            width:100%; padding:10px; border:none; border-radius:10px; margin-bottom:10px; font-size:14px; outline:none;
        }

        .total-box{ text-align:center; font-size:22px; font-weight:700; margin:15px 0; color: #fff; }

        .btn-order{
            width:100%; background:var(--whatsapp); border:none; padding:15px; font-size:16px;
            font-weight:700; color:white; border-radius:15px; cursor:pointer; transition:0.3s;
        }

        /* Admin Styles */
        .btn-admin-gear { position: absolute; top: 0; right: 0; background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; }
        .admin-panel {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: #1a1a1a; padding: 25px; border-radius: 20px;
            z-index: 1000; max-height: 80vh; overflow-y: auto; border: 2px solid var(--admin);
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; }
        .admin-day-row { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body onload="inicializarApp()">

<div class="container">
    <div class="header-logo">
        <button class="btn-admin-gear" onclick="verificarAdmin()">⚙️</button>
        <img src="https://i.imgur.com/3FvWdgi.gif">
        <h2>Restaurante Gourmet</h2>
        <span id="fechaHoy" class="badge"></span>
    </div>

    <form id="orderForm">
        <div class="section">
            <label>📅 DÍA DEL MENÚ</label>
            <select id="diaSemana" onchange="actualizarMenu()"></select>

            <label>🍲 PLATO PRINCIPAL</label>
            <select id="platoSeleccionado"></select>
        </div>

        <div class="section">
            <label>➕ ADICIONALES</label>
            <label style="color:white; font-weight:normal;"><input type="checkbox" value="2000" onchange="calcularTotal()" style="width:auto;"> Fruta (+$2.000)</label>
            <label style="color:white; font-weight:normal;"><input type="checkbox" value="1500" onchange="calcularTotal()" style="width:auto;"> Huevo Frito (+$1.500)</label>

            <label style="margin-top:10px;">🥤 BEBIDA</label>
            <select id="bebida" onchange="calcularTotal()">
                <option value="0">Jugo del día (Incluido)</option>
                <option value="2500">Limonada (+$2.500)</option>
                <option value="3000">Gaseosa (+$3.000)</option>
            </select>
        </div>

        <div class="total-box">💰 Total: $<span id="total">15,500</span></div>

        <div class="section">
            <label>👤 DATOS DE ENVÍO</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>
            <input type="text" id="direccion" placeholder="Dirección completa" required>
            <textarea id="notas" rows="2" placeholder="Notas (Ej: Sin cebolla)"></textarea>
        </div>

        <button type="button" class="btn-order" onclick="enviarWhatsApp()">🚀 ENVIAR PEDIDO</button>
    </form>
</div>

<div id="overlay" class="overlay" onclick="cerrarAdmin()"></div>
<div id="adminPanel" class="admin-panel">
    <h3 style="color:var(--admin); margin-bottom:15px;">Panel Administrador</h3>
    <div id="adminInputs"></div>
    <button onclick="guardarMenuAdmin()" style="width:100%; padding:12px; background:var(--admin); border:none; color:white; border-radius:10px; font-weight:bold; cursor:pointer;">💾 Guardar Cambios</button>
</div>

<script>
// === 1. CONFIGURACIÓN FIREBASE (REEMPLAZA ESTO) ===
const firebaseConfig = {
  apiKey: "AIzaSyBYX3jSSilzeExkkV3NDEZAlXJoNqWouw4",
  authDomain: "restaurante-menu-dadcc.firebaseapp.com",
  databaseURL: "https://restaurante-menu-dadcc-default-rtdb.firebaseio.com",
  projectId: "restaurante-menu-dadcc",
  storageBucket: "restaurante-menu-dadcc.firebasestorage.app",
  messagingSenderId: "493063436194",
  appId: "1:493063436194:web:0ca48049cf9022816a24fb"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);


// === 2. VARIABLES GLOBALES ===
const PRECIO_BASE = 15500;
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
let menus = {
    "Lunes": ["Cargando...", "..."], "Martes": ["Cargando...", "..."], "Miércoles": ["Cargando...", "..."],
    "Jueves": ["Cargando...", "..."], "Viernes": ["Cargando...", "..."], "Sábado": ["Cargando...", "..."]
};

// === 3. INICIO DE APP ===
function inicializarApp() {
    const selectDia = document.getElementById('diaSemana');
    DIAS.forEach(d => {
        let opt = document.createElement('option');
        opt.text = d;
        selectDia.add(opt);
    });

    // Detectar día actual
    const hoy = new Date();
    const diaReal = DIAS[hoy.getDay() - 1] || "Lunes";
    selectDia.value = diaReal;
    
    document.getElementById('fechaHoy').innerText = hoy.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

    // Cargar datos guardados del usuario (Delivery Info)
    document.getElementById("nombre").value = localStorage.getItem("nombre") || "";
    document.getElementById("direccion").value = localStorage.getItem("direccion") || "";

    // CONECTAR A FIREBASE
    db.ref('menuSemanal').on('value', (snapshot) => {
        if (snapshot.exists()) {
            menus = snapshot.val();
            actualizarMenu();
        }
    });

    calcularTotal();
}

function actualizarMenu() {
    const dia = document.getElementById('diaSemana').value;
    const selectPlato = document.getElementById('platoSeleccionado');
    selectPlato.innerHTML = "";
    menus[dia].forEach(p => {
        let opt = document.createElement('option');
        opt.text = p;
        selectPlato.add(opt);
    });
}

function calcularTotal() {
    let total = PRECIO_BASE;
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(e => total += parseInt(e.value));
    total += parseInt(document.getElementById('bebida').value);
    document.getElementById('total').innerText = total.toLocaleString();
}

// === 4. LÓGICA ADMIN ===
function verificarAdmin() {
    if (prompt("Clave de acceso:") === "1234") {
        const container = document.getElementById('adminInputs');
        container.innerHTML = "";
        DIAS.forEach(dia => {
            const div = document.createElement('div');
            div.className = "admin-day-row";
            div.innerHTML = `<label>${dia}</label>
                <input type="text" id="adm-${dia}-0" value="${menus[dia][0]}">
                <input type="text" id="adm-${dia}-1" value="${menus[dia][1]}">`;
            container.appendChild(div);
        });
        document.getElementById('adminPanel').style.display = "block";
        document.getElementById('overlay').style.display = "block";
    }
}

function guardarMenuAdmin() {
    const nuevoMenu = {};
    DIAS.forEach(dia => {
        nuevoMenu[dia] = [
            document.getElementById(`adm-${dia}-0`).value,
            document.getElementById(`adm-${dia}-1`).value
        ];
    });
    db.ref('menuSemanal').set(nuevoMenu).then(() => {
        alert("¡Menú actualizado globalmente!");
        cerrarAdmin();
    });
}

function cerrarAdmin() {
    document.getElementById('adminPanel').style.display = "none";
    document.getElementById('overlay').style.display = "none";
}

// === 5. WHATSAPP ===
function enviarWhatsApp() {
    const nom = document.getElementById('nombre').value;
    const dir = document.getElementById('direccion').value;
    if(!nom || !dir) return alert("Faltan datos de envío");

    localStorage.setItem("nombre", nom);
    localStorage.setItem("direccion", dir);

    const msj = `*NUEVO PEDIDO*\n\n👤 *Cliente:* ${nom}\n🏠 *Dir:* ${dir}\n🍲 *Plato:* ${document.getElementById('platoSeleccionado').value}\n🥤 *Bebida:* ${document.getElementById('bebida').options[document.getElementById('bebida').selectedIndex].text}\n💰 *Total:* $${document.getElementById('total').innerText}\n📝 *Notas:* ${document.getElementById('notas').value || 'Ninguna'}`;
    
    window.open(`https://wa.me/573143996019?text=${encodeURIComponent(msj)}`, '_blank');
}
</script>
</body>
</html>
