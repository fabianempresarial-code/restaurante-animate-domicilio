<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Online Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#ff7a18;
    --secondary:#ffb347;
    --whatsapp:#25d366;
    --glass:rgba(255,255,255,0.15);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
               url('https://i.imgur.com/UOPlh0M.jpeg');
    background-size:cover;
    background-position:center;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    animation:fadeIn 1s ease-in-out;
}

.container{
    width:100%;
    max-width:520px;
    backdrop-filter:blur(20px);
    background:var(--glass);
    border-radius:25px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    color:white;
    animation:slideUp 0.8s ease;
}

.header-logo{text-align:center;margin-bottom:15px;}
.header-logo img{width:180px;border-radius:15px;animation:float 4s ease-in-out infinite;}

h2{
    margin:10px 0;
    font-weight:700;
    background:linear-gradient(45deg,var(--primary),var(--secondary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.badge{
    display:inline-block;
    background:rgba(255,255,255,0.2);
    padding:6px 15px;
    border-radius:20px;
    font-size:13px;
}

.section{
    margin-bottom:15px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    transition:0.3s;
}

.section:hover{background:rgba(255,255,255,0.18);}

label{font-size:14px;font-weight:600;margin-bottom:5px;display:block;}

input,select,textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

input:focus,select:focus,textarea:focus{
    box-shadow:0 0 10px rgba(255,255,255,0.4);
    transform:scale(1.02);
}

.extra-item{font-size:14px;margin-bottom:10px;}

.total-box{
    text-align:center;
    font-size:21px;
    font-weight:700;
    margin-top:10px;
}

.btn-order{
    width:100%;
    background:var(--whatsapp);
    border:none;
    padding:15px;
    font-size:16px;
    font-weight:700;
    color:white;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
    animation:pulse 2s infinite;
}

.btn-order:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(37,211,102,0.5);
}

.admin-btn{
    margin-top:8px;
    padding:6px 12px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-size:13px;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(37,211,102,0.6)}
70%{box-shadow:0 0 0 15px rgba(37,211,102,0)}
100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}
}
</style>
</head>

<body onload="inicializarApp()">

<div class="container">

<div class="header-logo">
<img src="https://i.imgur.com/3FvWdgi.gif">
<h2>Restaurante Gourmet</h2>
<span id="fechaHoy" class="badge"></span><br>
<button class="admin-btn" onclick="activarAdmin()">⚙ Admin</button>
</div>

<form id="orderForm">

<div class="section">
<label>📅 Día del Menú:</label>
<select id="diaSemana" onchange="actualizarMenu()">
<option>Lunes</option>
<option>Martes</option>
<option>Miércoles</option>
<option>Jueves</option>
<option>Viernes</option>
<option>Sábado</option>
</select>

<label>🍲 Plato Principal:</label>
<select id="platoSeleccionado"></select>
</div>

<div class="section">
<label>➕ Adicionales:</label>
<label class="extra-item"><input type="checkbox" value="2000" onchange="calcularTotal()"> Fruta (+$2.000)</label>
<label class="extra-item"><input type="checkbox" value="1500" onchange="calcularTotal()"> Huevo Frito (+$1.500)</label>

<label>🥤 Bebida:</label>
<select id="bebida" onchange="calcularTotal()">
<option value="0">Jugo del día (Incluido)</option>
<option value="2500">Limonada (+$2.500)</option>
<option value="3000">Gaseosa (+$3.000)</option>
</select>

<div class="total-box">
💰 Total Domicilio: $<span id="total">15500</span>
</div>
</div>

<div class="section">
<label>👤 Datos de Envío:</label>
<input type="text" id="nombre" placeholder="Nombre completo" required>
<input type="text" id="direccion" placeholder="Ej: Calle 10 # 5-20" required>
<textarea id="notas" rows="2" placeholder="Notas adicionales..."></textarea>
</div>

<button type="button" class="btn-order" onclick="enviarWhatsApp()">🚀 Enviar Pedido</button>

</form>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AQUI_TU_API_KEY",
  authDomain: "AQUI_TU_AUTH_DOMAIN",
  projectId: "AQUI_TU_PROJECT_ID",
  storageBucket: "AQUI_TU_BUCKET",
  messagingSenderId: "AQUI_TU_ID",
  appId: "AQUI_TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const precioBase = 15500;
let menus = {};

window.inicializarApp = function(){
    const hoy=new Date();
    const opciones={weekday:'long',year:'numeric',month:'long',day:'numeric'};
    let fecha=hoy.toLocaleDateString('es-ES',opciones);
    fecha=fecha.charAt(0).toUpperCase()+fecha.slice(1);
    document.getElementById('fechaHoy').innerText="Hoy es "+fecha;

    const diasSemana=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    let diaReal=diasSemana[hoy.getDay()];
    if(diaReal==="Domingo"){ diaReal="Lunes"; }
    document.getElementById('diaSemana').value=diaReal;

    cargarMenus();
    calcularTotal();
}

function cargarMenus(){
    const ref = doc(db,"configuracion","menuSemanal");
    onSnapshot(ref,(snapshot)=>{
        if(snapshot.exists()){
            menus=snapshot.data();
            actualizarMenu();
        }
    });
}

window.actualizarMenu = function(){
    const dia=document.getElementById('diaSemana').value;
    const select=document.getElementById('platoSeleccionado');
    select.innerHTML="";
    if(!menus[dia]) return;
    menus[dia].forEach(p=>{
        let opt=document.createElement('option');
        opt.text=p.trim();
        select.add(opt);
    });
}

window.calcularTotal = function(){
    let total=precioBase;
    document.querySelectorAll('input[type="checkbox"]:checked')
    .forEach(e=> total+=parseInt(e.value));
    total+=parseInt(document.getElementById('bebida').value);
    document.getElementById('total').innerText=total.toLocaleString();
}

window.enviarWhatsApp = function(){
    const nombre=document.getElementById('nombre').value;
    const direccion=document.getElementById('direccion').value;
    if(!nombre||!direccion){ alert("Completa nombre y dirección"); return; }

    const dia=document.getElementById('diaSemana').value;
    const plato=document.getElementById('platoSeleccionado').value;
    const bebida=document.getElementById('bebida').options[document.getElementById('bebida').selectedIndex].text;
    const notas=document.getElementById('notas').value||"Ninguna";
    const total=document.getElementById('total').innerText;

    let mensaje=`*NUEVO PEDIDO*\n\n📅 Día: ${dia}\n👤 Cliente: ${nombre}\n🍲 Plato: ${plato}\n🥤 Bebida: ${bebida}\n🏠 Dirección: ${direccion}\n💰 Total: $${total}\n📝 Notas: ${notas}`;

    const url=`https://wa.me/573143996019?text=${encodeURIComponent(mensaje)}`;
    window.open(url,'_blank');
}

window.activarAdmin = async function(){
    const clave=prompt("Ingrese clave admin");
    if(clave!=="1234"){ alert("Clave incorrecta"); return; }

    let nuevoMenu={};
    for(const dia of ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"]){
        let platos=prompt(`Editar ${dia} (separar con coma)`,menus[dia]?.join(","));
        if(platos) nuevoMenu[dia]=platos.split(",");
    }

    await setDoc(doc(db,"configuracion","menuSemanal"),nuevoMenu);
    alert("Menú actualizado en todos los dispositivos ✅");
}
</script>

</body>
</html>
